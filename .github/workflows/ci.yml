name: CD

# Only runs on pushes to main (i.e. after a PR is merged) -- CI
# (ci.yml) already validated the image builds on every push/PR; this
# workflow's job is strictly "publish the validated image", so it
# intentionally does not duplicate CI's build-only check.
on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: price-intel-api

jobs:
  build-and-push:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Two tags per push to main:
      #   - `latest`     : always points at the most recent main build
      #   - `<git-sha>`  : immutable, traceable back to the exact
      #                    commit that produced it (useful alongside
      #                    MODEL_VERSION in main.py for tracing a
      #                    prediction_results row back to both the
      #                    model artifacts AND the code that served it)
      - name: Extract short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max